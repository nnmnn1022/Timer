<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
<title>Timer</title>
</head>
<body>
  <div class="backgroundfield">
    <!-- 타이머 제어 영역 -->
    <div class="timer-control-area">
      <div class="timer-display">0:00:00</div>
      <div class="title-input-area">
        <div class="work-input-grid">
          <input type="text" id="taskNumberInput" placeholder="작업번호">
          <input type="text" id="devNumberInput" placeholder="개발번호">
          <input type="text" id="jobNameInput" placeholder="잡명">
        </div>
        <div class="timer-buttons">
          <button id="startPauseBtn" class="start-pause-btn">
            <img class="btn-icon" src="images/play.svg" alt="play">
          </button>
          <button id="completeBtn">완료</button>
        </div>
      </div>
      <div class="memo-input-area">
        <textarea id="memoInput" placeholder="메모를 입력하세요"></textarea>
      </div>
      <div class="complete-area">
        <div class="auto-start-checkbox-area">
          <input type="checkbox" id="autoStartCheckbox">
          <label for="autoStartCheckbox">다음 타이머 자동 시작</label>
        </div>
      </div>
    </div>
    
    <!-- 저장 내역 영역 -->
    <div class="history-area">
      <div class="history-toggle collapsed" id="historyToggle">
        <span class="toggle-text">내역</span>
        <span class="toggle-arrow">▼</span>
      </div>
      <div class="history-content collapsed" id="historyContent">
        <div class="history-list" id="historyList">
          <!-- 저장된 내역이 여기에 표시됩니다 -->
        </div>
        <button id="clearAllBtn" class="clear-all-btn">전체삭제</button>
      </div>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
